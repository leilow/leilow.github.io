<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leimomi Bong</title>
<meta name="description" content="Leimomi Bong — host of The Catalyst on Bytemarks Café, Hawaiʻi Public Radio.">
<meta name="theme-color" content="#d6e4f0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&display=swap">
<style>
  :root { --mist: #d6e4f0; --ink: #24323f; --ink-soft: #4a5b6a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--mist); color: var(--ink); font-family: "EB Garamond", Georgia, serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100vh; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
  h1 { font-weight: 400; font-style: italic; font-size: clamp(44px, 8vw, 96px); line-height: 1.05; margin: 14vh 0 0; }
  p { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 12px; letter-spacing: 0.02em; color: var(--ink-soft); margin: 10px 0 0; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10vh; }
  a { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 12px; color: var(--ink); text-decoration: none; border: 0.5px solid var(--ink); border-radius: 3px; padding: 3px 7px; }
  a:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  @media (max-width: 600px) { main { padding: 18px 16px; } }
</style>
</head>
<body>
<main>
  <div>
    <h1>Leimomi Bong</h1>
    <p>Host of The Catalyst on Bytemarks Café, Hawaiʻi Public Radio.</p>
  </div>
  <nav>
    <a href="/catalyst/">The Catalyst</a>
    <a href="https://www.linkedin.com/in/leimomibong/">LinkedIn ↗</a>
    <a href="https://www.hawaiipublicradio.org/people/leimomi">Leimomi on HPR ↗</a>
  </nav>
</main>
</body>
</html>
